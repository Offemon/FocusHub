<div class="d-flex flex-d-row gap-2 align-i-center">
  <h4>To-dos</h4>
  <button class="font-bold" (click)="openTaskCreationDialog()">Create Task</button>
</div>
<div class="d-flex flex-d-row gap-2 my-2">
  <button type="button">All</button>
  <button type="button">Active</button>
  <button type="button">Completed</button>
</div>
@if(pagedTodoTasks(); as resolvedPagedToDoTasks){
  @if(resolvedPagedToDoTasks.isSuccess){
    @if(resolvedPagedToDoTasks.payload && resolvedPagedToDoTasks.payload.items){
      <app-todo-card-grid [tasks]="resolvedPagedToDoTasks.payload.items" [pageSize]="todoCardGridPageSize"/>
    }
  }
  @else{
    @if(resolvedPagedToDoTasks.errors){
      <app-banner [severity]="Severity.Error" [variant]="Variant.Outlined" [message]="resolvedPagedToDoTasks.errors[0]"/>
    } @else {
      <app-banner [severity]="Severity.Error" [variant]="Variant.Outlined" message="Failed to get response."/>
    }
  }
}
