<div>
  <app-session-player/>
</div>
<div class="tasks-container">
  @if(todoService.pendingToDos().length > 0){
    <app-todo-card-grid>
      @for(task of todoService.pendingToDos().slice(0,8); track task.id){
        <app-todo-card [todoTaskItem]="task" />
      }
    </app-todo-card-grid>
  }
</div>
