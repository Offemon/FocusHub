<div class="date-time-picker-wrapper d-flex flex-d-col gap-1">
  <label for="">
    {{ labelText() }}
  </label>
  <div class="picker-input-coupling-strip d-flex gap-1 align-i-center">
    <input
      #dateInput
      type="date"
      [disabled]="isDisabled()"
      [value]="localDate()"
      [min]="minAvailableDate()"
      (input)="onInputMutated(dateInput.value, timeInput.value)"
      class="picker-control-node"
    >
    <input
      #timeInput
      type="time"
      [disabled]=" isDisabled() || !localDate()"
      [value]="localTime()"
      [min]="dynamicMinTime()"
      (input)="onInputMutated(dateInput.value, timeInput.value)"
      class="picker-control-node"
    >
  </div>
  @if(isPastTimeInvalid()){
    <span class="constraint">
      Scheduling constraint: Deadlines must be set to at least 1 hour into the future.
    </span>
  }
</div>
